services:
  mariadb:
    image: mariadb:12.3
    container_name: 4klabs-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    ports:
      - "100.124.80.80:3306:3306"
    volumes:
      - /var/lib/4klabs-databases/mariadb:/var/lib/mysql

  redis:
    image: redis:7
    container_name: 4klabs-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "100.124.80.80:6379:6379"
    volumes:
      - /mnt/4klabs-pool/databases/redis:/data
